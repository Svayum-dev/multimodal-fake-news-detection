model:
  name: openai/clip-vit-base-patch32
  hidden_dim: 512
  dropout: 0.25
  num_classes: 2

data:
  image_dir: data/images
  text_column: clean_title
  image_url_column: image_url
  label_column: 2_way_label
  id_column: id

training:
  batch_size: 16
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0001
  confidence_threshold: 0.60
  seed: 42

labels:
  "0": Real
  "1": Fake
